<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reel Pick — Movie Recommendation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --ink-2: rgba(8,4,4,0.86);
    --marquee:#e50914;
    --red-hot:#ff2a2a;
    --velvet:#8a0a14;
    --paper:#f4eeee;
    --teal:#ff4d5a;
    --line: rgba(229,9,20,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html{ scroll-behavior:smooth; background:#000; }
  body{
    color: var(--paper);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x:hidden;
  }

  /* ---------- animated poster-wall background ---------- */
  .bg-layer{
    position: fixed; inset: -4%; z-index: -3;
    background-image: url("/static/background.jpg");
    background-size: cover;
    background-position: center;
    animation: kenburns 40s ease-in-out infinite alternate;
    /* brighten the (very dark) poster wall, then turn it into a red monochrome */
    filter: grayscale(1) contrast(1.2) brightness(1.7) sepia(1) hue-rotate(-38deg) saturate(5.5);
  }
  .bg-tint{
    position: fixed; inset:0; z-index:-2;
    background: rgba(110,0,10,0.22);
  }
  /* centre stays dark so the text is readable; posters show at the sides */
  .bg-overlay{
    position: fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse 55% 75% at 50% 38%, rgba(0,0,0,0.74) 0%, rgba(0,0,0,0.38) 70%, rgba(0,0,0,0.12) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.72) 100%);
  }
  @keyframes kenburns{
    0%{ transform: scale(1) translate(0,0); }
    100%{ transform: scale(1.12) translate(-1.5%, -1%); }
  }

  a{color:inherit; text-decoration:none;}

  .topbar{
    position: sticky; top: 0; z-index: 40;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px max(24px, 6vw);
    background: rgba(0,0,0,0.62); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(229,9,20,0.18);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Bebas Neue',sans-serif; font-size: 34px; letter-spacing:.02em; line-height:1; }
  .brand svg{ width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(229,9,20,0.55)); }
  .brand .b-pick{ color: var(--red-hot); }
  .nav-links{ display:flex; gap: 40px; }
  .nav-links a{
    position:relative; padding: 8px 0;
    font-weight:600; font-size: 14px; letter-spacing:.1em; text-transform:uppercase; color: #fff;
    transition: color .2s;
  }
  .nav-links a:hover{ color: var(--red-hot); }
  .nav-links a.active{ color: var(--red-hot); }
  .nav-links a.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-13px; height:2px; background: var(--red-hot);
    box-shadow: 0 0 10px rgba(229,9,20,0.8);
  }
  #discover{ display:block; height:0; scroll-margin-top: 90px; }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 34px 24px 80px; position:relative; }

  header{ text-align:center; margin-bottom: 32px; animation: dropIn .7s ease both; }
  @keyframes dropIn{ from{ opacity:0; transform: translateY(-16px);} to{ opacity:1; transform:translateY(0);} }

  .eyebrow{
    display:flex; align-items:center; justify-content:center; gap: 16px;
    font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.38em; text-transform:uppercase;
    color: var(--red-hot); font-size: 14px; margin-bottom: 14px;
  }
  .eyebrow::before, .eyebrow::after{ content:''; width: 38px; height: 2px; background: var(--red-hot); box-shadow: 0 0 8px rgba(229,9,20,0.7); }
  h1{
    font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing: .02em;
    font-size: clamp(3.4rem, 10vw, 7.4rem); line-height:.88;
    background: linear-gradient(180deg, #ffffff 0%, #d4d0d0 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 22px rgba(0,0,0,0.65));
  }
  h1 span{
    display:block;
    background: linear-gradient(180deg, #ff2a2a 0%, #c4000e 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: redGlow 4.5s ease-in-out infinite;
  }
  @keyframes redGlow{
    0%,100%{ filter: drop-shadow(0 0 16px rgba(229,9,20,0.45)); }
    50%{ filter: drop-shadow(0 0 34px rgba(229,9,20,0.85)); }
  }
  .tagline{ margin-top: 20px; color: rgba(255,255,255,0.8); font-size: 16px; line-height:1.6; max-width: 600px; margin-left:auto; margin-right:auto; font-weight:400;}
  .tagline .hl{ color: var(--red-hot); font-weight:700; }

  .search-shell{ position: relative; z-index: 30; max-width: 780px; margin: 30px auto 0; animation: dropIn .8s .1s ease both; }
  .search-box{
    display:flex; align-items:center; gap: 12px;
    background: var(--ink-2); backdrop-filter: blur(10px);
    border: 1px solid rgba(229,9,20,0.8); border-radius: 14px;
    padding: 8px 8px 8px 22px;
    box-shadow: 0 0 0 1px rgba(229,9,20,0.12), 0 0 30px rgba(229,9,20,0.22), inset 0 0 26px rgba(0,0,0,0.7);
    transition: border-color .25s, box-shadow .25s;
  }
  .search-box:focus-within{ border-color: #ff3b3b; box-shadow: 0 0 0 1px rgba(229,9,20,0.3), 0 0 44px rgba(229,9,20,0.38), inset 0 0 26px rgba(0,0,0,0.7); }
  .search-box > svg{ flex-shrink:0; color:#c9c2c2; opacity:.85; }
  #search{
    flex:1; min-width:0; background:transparent; border:none; outline:none; color: var(--paper);
    font-family:'Poppins',sans-serif; font-weight:400; font-size: 17px; letter-spacing:.01em;
  }
  #search::placeholder{ color: rgba(244,238,238,0.5); }
  .clear-btn{
    background:none; border:none; color: rgba(244,238,238,0.55); cursor:pointer;
    font-size: 18px; padding: 2px 6px; display:none;
  }
  .clear-btn.show{ display:block; }
  .search-btn{
    flex-shrink:0; border:none; cursor:pointer; color:#fff;
    background: linear-gradient(180deg, #ff1f2d 0%, #c4000e 100%);
    font-family:'Poppins',sans-serif; font-weight:700; font-size: 14px; letter-spacing:.12em; text-transform:uppercase;
    padding: 15px 30px; border-radius: 9px;
    box-shadow: 0 0 20px rgba(229,9,20,0.5);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .search-btn:hover{ filter: brightness(1.15); box-shadow: 0 0 30px rgba(229,9,20,0.8); transform: translateY(-1px); }

  #suggestions{
    position:absolute; top: calc(100% + 8px); left:0; right:0;
    background: #0c0a0a; border:1px solid var(--line); border-radius: 14px;
    max-height: 340px; overflow-y: auto; overscroll-behavior: contain;
    z-index: 30; box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    display:none; animation: dropIn .2s ease both;
  }
  #suggestions.show{ display:block; }
  #suggestions::-webkit-scrollbar{ width: 8px; }
  #suggestions::-webkit-scrollbar-thumb{ background: rgba(242,236,224,0.18); border-radius: 8px; }
  .sugg-item{
    padding: 12px 20px; cursor:pointer; display:flex; justify-content:space-between; gap: 12px;
    border-bottom: 1px solid var(--line); align-items:center; transition: background .15s;
  }
  .sugg-item:last-child{ border-bottom:none; }
  .sugg-item:hover, .sugg-item.active{ background: rgba(229,9,20,0.12); }
  .sugg-title{ font-family:'Poppins',sans-serif; font-weight:500; }
  .sugg-meta{ font-size: 12px; color: rgba(242,236,224,0.5); white-space:nowrap; }
  .sugg-empty{ padding: 16px 20px; color: rgba(242,236,224,0.5); font-size: 14px; }

  /* ---------- genre + language pills ---------- */
  .genre-row, .lang-row{
    position:relative; z-index: 1;
    display:flex; flex-wrap:wrap; justify-content:center; gap: 12px;
  }
  .lang-row{ max-width: 860px; margin: 30px auto 0; animation: dropIn .85s .12s ease both; }
  .genre-row{ max-width: 980px; margin: 22px auto 0; animation: dropIn .9s .15s ease both; }

  .genre-pill, .lang-pill{
    display:inline-flex; align-items:center; gap: 10px;
    background: rgba(8,4,4,0.72); backdrop-filter: blur(6px);
    border:1px solid rgba(229,9,20,0.32); color: #f4eeee;
    font-family:'Poppins',sans-serif; font-weight:600;
    border-radius: 6px; cursor:pointer;
    transition: all .2s ease;
  }
  .genre-pill{ font-size: 13.5px; letter-spacing:.1em; text-transform:uppercase; padding: 12px 24px; }
  .lang-pill{ font-size: 14px; letter-spacing:.02em; padding: 11px 20px; }
  .genre-pill:hover, .lang-pill:hover{
    border-color: var(--red-hot); color:#fff; transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(229,9,20,0.4);
  }
  .genre-pill.active, .lang-pill.active{
    background: linear-gradient(180deg, #ff1f2d 0%, #b3000f 100%);
    border-color: #ff3b3b; color:#fff;
    box-shadow: 0 0 22px rgba(229,9,20,0.6);
  }
  /* emoji icons: tint them red (white when the pill is active) */
  .ico{ display:inline-block; font-size: 1.1em; line-height:1; filter: grayscale(1) sepia(1) hue-rotate(-52deg) saturate(7) brightness(1.05); }
  .genre-pill.active .ico, .lang-pill.active .ico{ filter: grayscale(1) brightness(2.6); }

  .lang-badge{
    position:absolute; top:10px; left:10px; z-index:2;
    background: rgba(8,7,10,0.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(229,9,20,0.6); color: var(--paper);
    font-family:'Poppins',sans-serif; font-weight:600; font-size: 10px;
    letter-spacing:.03em; padding: 3px 9px; border-radius: 999px;
  }

  .surprise-row{ text-align:center; margin-top: 30px; animation: dropIn 1s .2s ease both; }
  #surprise{
    display:inline-flex; align-items:center; gap: 12px;
    background: rgba(70,0,8,0.4); border:1px solid var(--marquee); color: var(--red-hot);
    font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    font-size: 17px; padding: 15px 46px; border-radius: 6px; cursor:pointer;
    box-shadow: 0 0 24px rgba(229,9,20,0.25), inset 0 0 20px rgba(229,9,20,0.12);
    transition: background .2s, color .2s, box-shadow .2s, transform .2s;
  }
  #surprise:hover{ background: linear-gradient(180deg, #ff1f2d 0%, #b3000f 100%); color:#fff; box-shadow: 0 0 34px rgba(229,9,20,0.7); transform: translateY(-2px); }
  #surprise .ico{ font-size: 1.15em; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 44px 0 18px; flex-wrap:wrap; gap:8px;}
  .section-head h2{ font-family:'Poppins',sans-serif; font-weight:600; font-size: 20px; }
  .section-head h2 b{ color: var(--marquee); }
  .section-head .count{ color: rgba(242,236,224,0.5); font-size: 13px; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }
  .card{
    background: rgba(10,5,5,0.8); backdrop-filter: blur(8px);
    border:1px solid var(--line); border-radius: 14px; overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer;
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    opacity:0; transform: translateY(18px);
    animation: cardIn .5s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform: translateY(0);} }
  .card:hover{ transform: translateY(-6px); border-color: rgba(229,9,20,0.5); box-shadow: 0 18px 40px rgba(0,0,0,0.4); }
  .poster{
    aspect-ratio: 2/3; padding: 14px; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
  }
  .poster-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    transition: transform .3s ease;
  }
  .card:hover .poster-img{ transform: scale(1.05); }
  .poster::after{
    content:''; position:absolute; inset:0; z-index:1;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65) 100%);
  }
  .meta-row{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:2;}
  .rank{ font-family:'Bebas Neue',sans-serif; font-size: 30px; color: rgba(242,236,224,0.55); text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .sim-badge{
    background: rgba(10,9,12,0.6); border:1px solid rgba(242,236,224,0.25);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; letter-spacing:.04em;
    font-family:'Poppins',sans-serif; font-weight:500;
  }
  .poster-title{ font-family:'Bebas Neue',sans-serif; letter-spacing:.02em; font-size: 22px; line-height:1.05; position:relative; z-index:2; text-shadow: 0 2px 10px rgba(0,0,0,0.7);}
  .poster-sub{ font-size: 11px; color: rgba(242,236,224,0.7); margin-top:4px; position:relative; z-index:2;}
  .card-body{ padding: 14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-body h3{ font-family:'Poppins',sans-serif; font-size: 14.5px; font-weight:600; }
  .rating{ color: var(--marquee); font-size: 13px; font-weight:600; }
  .genre-pills{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{
    font-size: 10px; letter-spacing:.03em; text-transform:uppercase; padding: 3px 9px;
    border-radius: 999px; border:1px solid var(--line); color: rgba(242,236,224,0.65);
  }
  .blurb{ font-size: 12.5px; line-height:1.5; font-weight:300; color: rgba(242,236,224,0.62);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}

  .empty, .loading{ text-align:center; padding: 60px 20px; color: rgba(242,236,224,0.6); font-size: 14px; }
  .loading .dots span{ animation: blink 1.4s infinite; }
  .loading .dots span:nth-child(2){ animation-delay:.2s; }
  .loading .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border: 3px solid rgba(242,236,224,0.2); border-top-color: var(--marquee);
    margin: 0 auto 14px; animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (max-width:520px){ .grid{ grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:14px;} }

  /* ============ MOBILE OPTIMIZATION ============ */
  @media (max-width: 720px){
    .topbar{ padding: 10px 16px; }
    .brand{ font-size: 26px; gap: 8px; }
    .brand svg{ width: 32px; height: 32px; }
    .nav-links{ gap: 18px; }
    .nav-links a{ font-size: 11.5px; letter-spacing:.06em; }
    .nav-links a.active::after{ bottom:-11px; }
    .wrap{ padding: 24px 18px 60px; }
    header{ margin-bottom: 24px; }
    .eyebrow{ letter-spacing:.28em; font-size: 11px; gap: 10px; }
    .eyebrow::before, .eyebrow::after{ width: 22px; }
    h1{ font-size: clamp(2.8rem, 15vw, 4.4rem); }
    .tagline{ font-size: 13.5px; padding: 0 4px; line-height:1.5; }

    .search-shell{ margin: 26px auto 0; max-width: 100%; }
    .search-box{ padding: 6px 6px 6px 14px; border-radius: 12px; gap: 8px; }
    .search-btn{ padding: 12px 16px; font-size: 12px; letter-spacing:.08em; }
    #search{ font-size: 16px; } /* keep >=16px: prevents iOS auto-zoom on focus */

    #suggestions{ max-height: 280px; border-radius: 12px; }
    .sugg-item{ padding: 13px 16px; }
    .sugg-title{ font-size: 14px; }
    .sugg-meta{ font-size: 11px; }

    /* Genre chips become a horizontal swipe strip instead of wrapping into
       a tall block that pushes everything else down the page. */
    .genre-row{
      flex-wrap: nowrap; justify-content: flex-start;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
      margin: 22px -18px 0; padding: 4px 18px 10px;
      mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
    }
    .genre-pill{ flex: 0 0 auto; font-size: 12px; padding: 10px 16px; }
    .lang-pill{ font-size: 13px; padding: 9px 14px; }
    .lang-row{ gap: 8px; margin-top: 24px; }

    .surprise-row{ margin-top: 16px; }
    #surprise{ font-size: 13.5px; padding: 12px 30px; }

    .section-head{ margin: 32px 0 14px; }
    .section-head h2{ font-size: 17px; }
    .section-head .count{ font-size: 12px; }

    .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .card{ border-radius: 12px; }
    .card:active{ transform: translateY(-2px); border-color: rgba(229,9,20,0.5); }
    .poster{ padding: 10px; }
    .rank{ font-size: 22px; }
    .sim-badge{ font-size: 10px; padding: 3px 8px; }
    .poster-title{ font-size: 16px; }
    .poster-sub{ font-size: 10px; }
    .card-body{ padding: 11px 12px 13px; gap:6px; }
    .card-body h3{ font-size: 12.5px; }
    .rating{ font-size: 12px; }
    .pill{ font-size: 9px; padding: 2px 7px; }
    .blurb{ font-size: 11px; -webkit-line-clamp: 2; }

    .empty, .loading{ padding: 44px 16px; font-size: 13px; }
  }

  /* Extra-narrow phones (SE / small Android) */
  @media (max-width: 380px){
    .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .poster-title{ font-size: 14.5px; }
    h1{ font-size: 2.6rem; }
  }

  /* Avoid styles getting "stuck" after a tap on touch devices; only apply
     hover effects on devices that actually support hover (mouse/trackpad). */
  @media (hover: none){
    .card:hover{ transform:none; border-color: var(--line); box-shadow:none; }
    .genre-pill:hover, .lang-pill:hover{ border-color: rgba(229,9,20,0.32); color: #f4eeee; transform:none; box-shadow:none; }
    #surprise:hover{ border-color: var(--line); color: var(--paper); }
    .genre-pill:active, .lang-pill:active{ border-color: var(--red-hot); color: var(--red-hot); }
  }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-tint"></div>
<div class="bg-overlay"></div>

<nav class="topbar">
  <a class="brand" href="#top" aria-label="Reel Pick home">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#e50914"/>
      <circle cx="24" cy="24" r="5" fill="#0a0404"/>
      <circle cx="24" cy="10.5" r="5.2" fill="#0a0404"/>
      <circle cx="36.5" cy="19" r="5.2" fill="#0a0404"/>
      <circle cx="31.5" cy="34" r="5.2" fill="#0a0404"/>
      <circle cx="16.5" cy="34" r="5.2" fill="#0a0404"/>
      <circle cx="11.5" cy="19" r="5.2" fill="#0a0404"/>
    </svg>
    <span><span class="b-reel">REEL</span> <span class="b-pick">PICK</span></span>
  </a>
  <div class="nav-links">
    <a href="#top" class="active" id="navHome">Home</a>
    <a href="#discover" id="navDiscover">Discover</a>
  </div>
</nav>

<div class="wrap" id="top">
  <header>
    <div class="eyebrow">Reel Pick</div>
    <h1>Find your next <span>obsession.</span></h1>
    <p class="tagline">Search a movie you love — Reel Pick digs through cast, crew, genre and plot to find what to watch next, out of <b class="hl">7,000+</b> films.</p>

    <div class="search-shell">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search" autocomplete="off">
        <button class="clear-btn" id="clearBtn">✕</button>
        <button class="search-btn" id="searchBtn" type="button">Search</button>
      </div>
      <div id="suggestions"></div>
    </div>

    <span id="discover"></span>
    <div class="lang-row" id="langRow">
      <!-- populated dynamically from /languages -->
    </div>

    <div class="genre-row" id="genreRow">
      <button class="genre-pill" data-genre="Action"><span class="ico">🔫</span> Action</button>
      <button class="genre-pill" data-genre="Adventure"><span class="ico">🗺️</span> Adventure</button>
      <button class="genre-pill" data-genre="Horror"><span class="ico">👻</span> Ghost / Horror</button>
      <button class="genre-pill" data-genre="Romance"><span class="ico">❤️</span> Romance</button>
      <button class="genre-pill" data-genre="Comedy"><span class="ico">😂</span> Comedy</button>
      <button class="genre-pill" data-genre="Thriller"><span class="ico">🔪</span> Thriller</button>
      <button class="genre-pill" data-genre="Drama"><span class="ico">🎭</span> Drama</button>
      <button class="genre-pill" data-genre="Animation"><span class="ico">🎨</span> Animation</button>
      <button class="genre-pill" data-genre="Science Fiction"><span class="ico">🚀</span> Sci-Fi</button>
      <button class="genre-pill" data-genre="Fantasy"><span class="ico">🧙</span> Fantasy</button>
      <button class="genre-pill" data-genre="Crime"><span class="ico">🕵️</span> Crime</button>
      <button class="genre-pill" data-genre="Family"><span class="ico">👨‍👩‍👧</span> Family</button>
    </div>

    <div class="surprise-row">
      <button id="surprise"><span class="ico">🎲</span> Surprise Me</button>
    </div>
  </header>

  <div class="status-line" id="statusLine"></div>

  <div id="resultsArea"></div>
</div>

<script>
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const suggEl = document.getElementById('suggestions');
const statusLine = document.getElementById('statusLine');
const resultsArea = document.getElementById('resultsArea');
const genreRow = document.getElementById('genreRow');
const langRow = document.getElementById('langRow');

const RECOMMEND_LIMIT = 30;
const LANG_HUES = [352, 356, 0, 4, 348, 8];

function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function posterGradient(title){
  const h = hashStr(title);
  const baseHue = LANG_HUES[h % LANG_HUES.length];
  const hue1 = (baseHue + (h % 26) - 13 + 360) % 360;
  const hue2 = (hue1 + 6 + (h % 10)) % 360;
  const angle = 120 + (h % 60);
  return `linear-gradient(${angle}deg, hsl(${hue1} 35% 8%), hsl(${hue2} 75% 30%))`;
}

function debounce(fn, wait){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}

// ---------- live search suggestions ----------
let activeIndex = -1;
let currentMatches = [];

async function fetchSuggestions(query){
  try{
    const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
    if(!res.ok) throw new Error('search failed');
    return await res.json();
  }catch(err){
    return [];
  }
}

function renderSuggestions(matches){
  currentMatches = matches;
  activeIndex = -1;
  if(matches.length === 0){
    suggEl.innerHTML = `<div class="sugg-empty">No titles match — try a different spelling.</div>`;
    suggEl.classList.add('show');
    return;
  }
  suggEl.innerHTML = matches.map((m, i) => `
    <div class="sugg-item" data-index="${i}" data-title="${m.title.replace(/"/g,'&quot;')}">
      <span class="sugg-title">${m.title}</span>
      <span class="sugg-meta">${m.year || ''}${m.year ? ' · ' : ''}★ ${m.rating.toFixed(1)}</span>
    </div>
  `).join('');
  suggEl.classList.add('show');

  suggEl.querySelectorAll('.sugg-item').forEach(item => {
    item.addEventListener('click', () => {
      const title = item.getAttribute('data-title');
      searchEl.value = title;
      suggEl.classList.remove('show');
      clearActiveGenre();
      loadRecommendations(title);
    });
  });
}

const debouncedSearch = debounce(async (query) => {
  if(query.trim().length < 2){
    suggEl.classList.remove('show');
    return;
  }
  const matches = await fetchSuggestions(query);
  renderSuggestions(matches);
}, 250);

searchEl.addEventListener('input', () => {
  clearBtn.classList.toggle('show', searchEl.value.length > 0);
  debouncedSearch(searchEl.value);
});

searchEl.addEventListener('keydown', (e) => {
  const items = suggEl.querySelectorAll('.sugg-item');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    updateActive(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    updateActive(items);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(activeIndex >= 0 && currentMatches[activeIndex]){
      const title = currentMatches[activeIndex].title;
      searchEl.value = title;
      suggEl.classList.remove('show');
      clearActiveGenre();
      loadRecommendations(title);
    } else if(searchEl.value.trim()){
      suggEl.classList.remove('show');
      clearActiveGenre();
      loadRecommendations(searchEl.value.trim());
    }
  } else if(e.key === 'Escape'){
    suggEl.classList.remove('show');
  }
});

function updateActive(items){
  items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
  if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'});
}

// SEARCH button: same action as pressing Enter
document.getElementById('searchBtn').addEventListener('click', () => {
  const q = searchEl.value.trim();
  if(!q){ searchEl.focus(); return; }
  suggEl.classList.remove('show');
  loadRecommendations(q);
});

// top-bar nav: highlight the active link
document.querySelectorAll('.nav-links a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('.nav-links a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  });
});

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  clearBtn.classList.remove('show');
  suggEl.classList.remove('show');
  resultsArea.innerHTML = '';
  statusLine.innerHTML = '';
  searchEl.focus();
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-shell')) suggEl.classList.remove('show');
});

// ---------- recommendations ----------
async function loadRecommendations(movieTitle){
  statusLine.innerHTML = '';
  resultsArea.innerHTML = `<div class="loading"><div class="spinner"></div>Finding films like <b>${movieTitle}</b><span class="dots">...</span></div>`;

  try{
    const res = await fetch(`/recommend?movie=${encodeURIComponent(movieTitle)}&limit=${RECOMMEND_LIMIT}`);
    const data = await res.json();

    if(!res.ok){
      resultsArea.innerHTML = `<div class="empty">${data.error || 'Something went wrong — try another title.'}</div>`;
      return;
    }
    if(!Array.isArray(data) || data.length === 0){
      resultsArea.innerHTML = `<div class="empty">No matches found for "${movieTitle}" — try a different spelling or a more well-known title.</div>`;
      return;
    }

    renderResults(`Because you liked <b>${movieTitle}</b>`, data);
  }catch(err){
    resultsArea.innerHTML = `<div class="empty">Couldn't reach the recommendation engine. Is the Flask server running?</div>`;
  }
}

// ---------- genre browsing ----------
function clearActiveGenre(){
  genreRow.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
  if(typeof clearActiveLang === 'function') clearActiveLang();
}

async function loadGenre(genreName, pillEl){
  clearActiveGenre();
  if(pillEl) pillEl.classList.add('active');
  searchEl.value = '';
  clearBtn.classList.remove('show');
  suggEl.classList.remove('show');
  statusLine.innerHTML = '';
  resultsArea.innerHTML = `<div class="loading"><div class="spinner"></div>Rounding up <b>${genreName}</b> picks<span class="dots">...</span></div>`;

  try{
    const res = await fetch(`/genre?name=${encodeURIComponent(genreName)}&limit=${RECOMMEND_LIMIT}`);
    const data = await res.json();

    if(!res.ok){
      resultsArea.innerHTML = `<div class="empty">${data.error || 'Something went wrong.'}</div>`;
      return;
    }
    if(!Array.isArray(data) || data.length === 0){
      resultsArea.innerHTML = `<div class="empty">No movies found for "${genreName}".</div>`;
      return;
    }
    renderResults(`Top <b>${genreName}</b> picks`, data, false);
  }catch(err){
    resultsArea.innerHTML = `<div class="empty">Couldn't reach the recommendation engine. Is the Flask server running?</div>`;
  }
}

genreRow.querySelectorAll('.genre-pill').forEach(pill => {
  pill.addEventListener('click', () => loadGenre(pill.getAttribute('data-genre'), pill));
});

// ---------- language browsing ----------
function clearActiveLang(){
  langRow.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
}

async function loadLanguage(langName, pillEl){
  clearActiveGenre();
  clearActiveLang();
  if(pillEl) pillEl.classList.add('active');
  searchEl.value = '';
  clearBtn.classList.remove('show');
  suggEl.classList.remove('show');
  statusLine.innerHTML = '';
  resultsArea.innerHTML = `<div class="loading"><div class="spinner"></div>Rounding up <b>${langName}</b> picks<span class="dots">...</span></div>`;

  try{
    const res = await fetch(`/language?name=${encodeURIComponent(langName)}&limit=${RECOMMEND_LIMIT}`);
    const data = await res.json();

    if(!res.ok){
      resultsArea.innerHTML = `<div class="empty">${data.error || 'Something went wrong.'}</div>`;
      return;
    }
    if(!Array.isArray(data) || data.length === 0){
      resultsArea.innerHTML = `<div class="empty">No movies found for "${langName}".</div>`;
      return;
    }
    renderResults(`Top <b>${langName}</b> picks`, data, false);
  }catch(err){
    resultsArea.innerHTML = `<div class="empty">Couldn't reach the recommendation engine. Is the Flask server running?</div>`;
  }
}

async function loadLanguagePills(){
  try{
    const res = await fetch('/languages');
    const langs = await res.json();
    if(!Array.isArray(langs) || langs.length === 0) return;

    const ICONS = { Tamil: '🎬', English: '🎞️', Hindi: '🎥', Telugu: '📽️', Malayalam: '🍿', Kannada: '🎦' };

    langRow.innerHTML = `<button class="lang-pill active" data-lang="__all"><span class="ico">🌐</span> All Languages</button>` +
      langs.map(l => `<button class="lang-pill" data-lang="${l.replace(/"/g,'&quot;')}"><span class="ico">${ICONS[l] || '🌍'}</span> ${l}</button>`).join('');

    langRow.querySelectorAll('.lang-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const lang = pill.getAttribute('data-lang');
        if(lang === '__all'){
          clearActiveLang();
          pill.classList.add('active');
          resultsArea.innerHTML = '';
          statusLine.innerHTML = '';
          return;
        }
        loadLanguage(lang, pill);
      });
    });
  }catch(err){
    // languages row is a nice-to-have; fail silently if the endpoint is unreachable
  }
}
loadLanguagePills();

function renderResults(headingHtml, movies, showSimilarity = true){
  resultsArea.innerHTML = `
    <div class="section-head">
      <h2>${headingHtml}</h2>
      <span class="count">${movies.length} picks</span>
    </div>
    <div class="grid" id="grid"></div>
  `;
  const gridEl = document.getElementById('grid');

  movies.forEach((m, i) => {
    const genres = (m.genres || '').split(',').map(g => g.trim()).filter(Boolean).slice(0, 3);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${Math.min(i * 0.04, 0.6)}s`;
    card.innerHTML = `
      <div class="poster" style="background:${posterGradient(m.title)}">
        ${m.poster ? `<img class="poster-img" src="${m.poster}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        ${m.language ? `<span class="lang-badge">${m.language}</span>` : ''}
        <div class="meta-row">
          <span class="rank">${String(i+1).padStart(2,'0')}</span>
          ${showSimilarity && m.similarity !== undefined ? `<span class="sim-badge">${Math.round(m.similarity*100)}% match</span>` : ''}
        </div>
        <div>
          <div class="poster-title">${m.title}</div>
          <div class="poster-sub">${m.year || (m.duration ? '' : 'Year unknown')}${m.duration ? (m.year ? ' · ' : '') + m.duration : ''}</div>
        </div>
      </div>
      <div class="card-body">
        <h3>${m.title}</h3>
        <span class="rating">★ ${m.rating.toFixed(1)}</span>
        <div class="genre-pills">${genres.map(g => `<span class="pill">${g}</span>`).join('')}</div>
        <p class="blurb">${m.overview || 'No synopsis available.'}</p>
      </div>
    `;
    card.addEventListener('click', () => {
      searchEl.value = m.title;
      clearActiveGenre();
      loadRecommendations(m.title);
      window.scrollTo({top:0, behavior:'smooth'});
    });
    gridEl.appendChild(card);
  });
}

// ---------- surprise me ----------
document.getElementById('surprise').addEventListener('click', async () => {
  clearActiveGenre();
  statusLine.innerHTML = `<span class="msg">Shuffling the reel<span class="dots">...</span></span>`;
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  const letter = letters[Math.floor(Math.random() * letters.length)];
  const matches = await fetchSuggestions(letter);
  if(matches.length === 0){
    statusLine.innerHTML = `<span class="msg">Couldn't find a pick — try searching instead.</span>`;
    return;
  }
  const pick = matches[Math.floor(Math.random() * matches.length)];
  searchEl.value = pick.title;
  statusLine.innerHTML = '';
  loadRecommendations(pick.title);
});
</script>
</body>
</html>
